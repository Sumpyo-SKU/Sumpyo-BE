# 실행: docker compose up -d --build
# 변수는 같은 폴더의 .env 에서 자동으로 읽힘 (DB_USERNAME, DB_PASSWORD, DEVICE_KEY_517 ...)
services:
  db:
    image: postgres:16
    container_name: sumpyo-postgres
    environment:
      POSTGRES_DB: sumpyo
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "5435:5432"   # 로컬 IntelliJ 실행 시에도 localhost:5435 로 접속 가능
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d sumpyo"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    container_name: sumpyo-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      # 컨테이너 안에서는 localhost 가 아니라 서비스 이름(db)으로 접속
      DB_URL: jdbc:postgresql://db:5432/sumpyo
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DEVICE_KEY_517: ${DEVICE_KEY_517}
      DEMO_PASSWORD: ${DEMO_PASSWORD}
      COMPLAINT_SALT: ${COMPLAINT_SALT}
      FRONT_BASE_URL: ${FRONT_BASE_URL:-http://localhost:5173}
      DATA_GO_KR_KEY: ${DATA_GO_KR_KEY:-}
      WEATHER_NX: ${WEATHER_NX:-}
      WEATHER_NY: ${WEATHER_NY:-}
      AIR_STATION_NAME: ${AIR_STATION_NAME:-}
      DEMO_HEADER_LOGIN: ${DEMO_HEADER_LOGIN:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      SIMULATOR_ENABLED: ${SIMULATOR_ENABLED:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
