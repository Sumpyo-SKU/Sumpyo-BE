# 실행: docker compose up -d --build
# 변수는 같은 폴더의 .env 에서 자동으로 읽힘 (DB_USERNAME, DB_PASSWORD, DEVICE_KEY_517 ...)
services:
  db:
    image: postgres:16
    container_name: sumpyo-postgres
    environment:
      POSTGRES_DB: sumpyo
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "5435:5432"   # 로컬 IntelliJ 실행 시에도 localhost:5435 로 접속 가능
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d sumpyo"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: sumpyo-redis
    restart: unless-stopped

  app:
    build: .
    container_name: sumpyo-app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      # 컨테이너 안에서는 localhost 가 아니라 서비스 이름(db, redis)으로 접속
      DB_URL: jdbc:postgresql://db:5432/sumpyo
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DEVICE_KEY_517: ${DEVICE_KEY_517}
      DEMO_PASSWORD: ${DEMO_PASSWORD}
      SIMULATOR_ENABLED: ${SIMULATOR_ENABLED:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
