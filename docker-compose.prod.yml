# EC2 운영용 compose (GitHub Actions가 ~/sumpyo 로 복사함)
# 같은 폴더의 .env 는 EC2에서 직접 만들어 둠 (git에 올리지 않음)
services:
  db:
    image: postgres:16
    container_name: sumpyo-postgres
    environment:
      POSTGRES_DB: sumpyo
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:5432:5432"   # 외부 미공개. 접속은 SSH 터널로만
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d sumpyo"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    image: ${DOCKERHUB_USERNAME}/sumpyo-be:${IMAGE_TAG:-latest}
    container_name: sumpyo-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/sumpyo
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DEVICE_KEY_517: ${DEVICE_KEY_517}
      DEMO_PASSWORD: ${DEMO_PASSWORD}
      COMPLAINT_SALT: ${COMPLAINT_SALT}
      FRONT_BASE_URL: ${FRONT_BASE_URL:-http://localhost:5173}
      DATA_GO_KR_KEY: ${DATA_GO_KR_KEY:-}
      WEATHER_NX: ${WEATHER_NX:-}
      WEATHER_NY: ${WEATHER_NY:-}
      AIR_STATION_NAME: ${AIR_STATION_NAME:-}
      DEMO_HEADER_LOGIN: ${DEMO_HEADER_LOGIN:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      SIMULATOR_ENABLED: ${SIMULATOR_ENABLED:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m"   # 1GB 인스턴스 기준
    ports:
      - "8080:8080"   # 아두이노는 HTTP 8080 으로 직접 전송
    restart: unless-stopped

  caddy:
    image: caddy:2
    container_name: sumpyo-caddy
    depends_on:
      - app
    environment:
      API_DOMAIN: ${API_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # 발급된 인증서 보관 (지우면 재발급됨)
      - caddy_config:/config
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
