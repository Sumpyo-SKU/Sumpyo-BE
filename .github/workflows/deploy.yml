name: Deploy to EC2

on:
  push:
    branches: [develop]
  workflow_dispatch:   # Actions 탭에서 수동 실행 가능

concurrency:
  group: deploy-ec2
  cancel-in-progress: true

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/sumpyo-be

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64   # t4g 등 ARM 인스턴스면 linux/arm64 로 변경
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.prod.yml
          target: ~/sumpyo

      - name: Pull & restart on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/sumpyo
            export IMAGE_TAG=${{ github.sha }}
            docker compose -f docker-compose.prod.yml pull app
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
            # 헬스체크 (최대 90초 대기)
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8080/api/health > /dev/null; then
                echo "Deploy OK: $IMAGE_TAG"; exit 0
              fi
              sleep 3
            done
            echo "Health check failed"; docker compose -f docker-compose.prod.yml logs --tail 100 app; exit 1
