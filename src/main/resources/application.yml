spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/sumpyo}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway(db/migration)가 관리
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 운영 DB에는 Flyway 이전에 JPA가 만든 sensor_reading 이 있어서 필요 (V0 으로 baseline 후 V1부터 적용)
    baseline-on-migrate: true
    baseline-version: 0

server:
  # Caddy(HTTPS 프록시) 뒤에서 X-Forwarded-* 헤더를 신뢰 → Swagger 등이 https 주소를 생성
  forward-headers-strategy: framework

device:
  # room code → 기기 키 (X-Device-Key)
  keys:
    "[bukak-617]": ${DEVICE_KEY_617:${DEVICE_KEY_517}}
    # TODO: ESP32 펌웨어 교체 후 제거 (예전 517 키 허용)
    "[517]": ${DEVICE_KEY_517}
  # 예전 경로 값 → room code. ESP32 가 아직 /api/rooms/517/readings 로 보내는 중
  # TODO: 펌웨어를 /api/rooms/bukak-617/readings 로 다시 올리면 제거
  aliases:
    "[517]": bukak-617

sumpyo:
  auth:
    # JWT(HS256) 서명 키. 32바이트 이상, 없으면 앱이 뜨지 않는다 (예: openssl rand -base64 48)
    jwt-secret: ${JWT_SECRET:}
    token-validity: 7d
  simulator:
    # SIM 강의실 측정값을 1분마다 생성. 끄려면 SIMULATOR_ENABLED=false
    enabled: ${SIMULATOR_ENABLED:true}
  demo:
    # 로그인 전 임시 데모 근로생(worker01) 비밀번호. 비어 있으면 계정을 만들지 않음
    password: ${DEMO_PASSWORD:}
    # 데모 모드: X-Demo-Login 헤더로 데모 계정(worker01, worker02) 전환. 로그인을 붙이면 끌 것
    header-login: ${DEMO_HEADER_LOGIN:false}
  complaint:
    # 학생 민원 client_hash = SHA-256(clientId + salt). 비어 있으면 민원 접수만 503
    salt: ${COMPLAINT_SALT:}
    # 민원 QR 내용 = {front-base-url}/complaint?code={room.code}
    front-base-url: ${FRONT_BASE_URL:http://localhost:5173}
  notification:
    # 알림 스캔(환기·곧 환기·센서 끊김) 1분마다. 테스트에서는 끄고 직접 호출
    scan-enabled: ${NOTIFICATION_SCAN_ENABLED:true}
  outdoor:
    # 바깥 공기 수집 (공공데이터포털, 매시 10분). 키·위치가 하나라도 비면 수집하지 않고 경고만
    api-key: ${DATA_GO_KR_KEY:}
    nx: ${WEATHER_NX:}
    ny: ${WEATHER_NY:}
    station: ${AIR_STATION_NAME:}
    collect-enabled: ${OUTDOOR_COLLECT_ENABLED:true}
  llm:
    # 캠퍼스톡 추천 답변. 셋 다 있을 때만 LLM 사용 (gemini | openai | anthropic), 아니면 규칙 기반
    provider: ${LLM_PROVIDER:}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
