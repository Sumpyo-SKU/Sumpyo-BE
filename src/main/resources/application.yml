spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/sumpyo}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  # Caddy(HTTPS 프록시) 뒤에서 X-Forwarded-* 헤더를 신뢰 → Swagger 등이 https 주소를 생성
  forward-headers-strategy: framework

device:
  keys:
    "[517]": ${DEVICE_KEY_517}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
