spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/sumpyo}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway(db/migration)가 관리
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 운영 DB에는 Flyway 이전에 JPA가 만든 sensor_reading 이 있어서 필요 (V0 으로 baseline 후 V1부터 적용)
    baseline-on-migrate: true
    baseline-version: 0

server:
  # Caddy(HTTPS 프록시) 뒤에서 X-Forwarded-* 헤더를 신뢰 → Swagger 등이 https 주소를 생성
  forward-headers-strategy: framework

device:
  # room code → 기기 키 (X-Device-Key)
  keys:
    "[bukak-617]": ${DEVICE_KEY_617:${DEVICE_KEY_517}}
    # TODO: ESP32 펌웨어 교체 후 제거 (예전 517 키 허용)
    "[517]": ${DEVICE_KEY_517}
  # 예전 경로 값 → room code. ESP32 가 아직 /api/rooms/517/readings 로 보내는 중
  # TODO: 펌웨어를 /api/rooms/bukak-617/readings 로 다시 올리면 제거
  aliases:
    "[517]": bukak-617

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
